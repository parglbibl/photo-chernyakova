    <!-- Подключаем FontAwesome (твой) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Подключаем общий CSS (твой) -->

    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <link rel="manifest" href="/site.webmanifest">

    <!-- Стили только для страницы открыток, чтобы не сломать остальной сайт -->
    <style>
        /* Контейнер для открыток */
        .cards-wrapper {
            padding: 40px 0;
            position: relative;
            z-index: 1;
        }
        
        .cards-header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 20px;
        }
        .cards-header h1 {
            font-size: clamp(32px, 4vw, 56px);
            font-weight: 300;
            color: #fff;
        }
        .cards-header h1 span { color: var(--accent, #C39A74); font-weight: 600; }
        .cards-header .sub {
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* Сетка для карточек */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        /* 3D Карточка */
        .flip-3d-card {
            perspective: 2500px; 
            perspective-origin: right center; 
            cursor: pointer;
            aspect-ratio: 3 / 2;
            border-radius: 16px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9);
        }

        .flip-3d-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-style: preserve-3d;
            border-radius: 16px;
        }

        .flip-3d-card.flipped .flip-3d-inner {
            transform: rotateY(-180deg);
        }

        .flip-3d-front, .flip-3d-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
        }

        /* Передняя сторона (Фото) */
        .flip-3d-front {
            background: #1a1816;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .flip-3d-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Задняя сторона (Текст) */
        .flip-3d-back {
            background: rgba(24, 23, 21, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        .flip-3d-back h3 {
            color: var(--accent, #C39A74);
            font-size: 26px;
            font-weight: 400;
            margin-bottom: 12px;
        }
        .flip-3d-back p {
            font-size: 16px;
            color: var(--muted, #D2CBC2);
            line-height: 1.6;
            font-weight: 300;
            max-width: 85%;
        }

        @media (max-width: 700px) {
            .card-grid { grid-template-columns: 1fr; gap: 30px; }
            .flip-3d-card { aspect-ratio: 4 / 3; }
            .flip-3d-back { padding: 30px; }
            .flip-3d-back h3 { font-size: 22px; }
            .flip-3d-back p { font-size: 15px; max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- ФОН (твой) -->
    <img id="top-layer-gerbera" src="images/bg.webp">

    <!-- ЛОГОТИП (твой) -->
    <a href="index.html">
        <img src="images/logo.png" alt="Галина Чернякова Photography" class="site-logo">
    </a>

    <!-- ХЕДЕР (твой, из style.css) -->
    <header>
        <div class="header-inner">
            <button class="burger-btn" id="burgerBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav" id="mainNav">
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О себе</a></li>
                <li><a href="projects.html">Проекты</a></li>
                <li><a href="achievements.html">Достижения</a></li>
                
                <li class="dropdown">
                    <span class="dropdown-toggle">Галерея</span>
                    <ul class="dropdown-content">
                        <li><a href="macro.html">Макромир</a></li>
                        <li><a href="concept.html">Концепт</a></li>
                        <li><a href="nature.html">Природа</a></li>
                    </ul>
                </li>

                <li><a href="news.html">Новости</a></li>
                <li><a href="faq.html">Вопросы и ответы</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="cards.html" class="active">Карточки</a></li> <!-- Добавили сюда -->
            </ul>
        </div>
    </header>

    <!-- КОНТЕНТ СТРАНИЦЫ -->
    <div class="container">
        <div class="cards-wrapper">
            <div class="cards-header">
                <h1>Карточки <span>настроения</span></h1>
                <div class="sub">Нажми, чтобы перевернуть и прочитать</div>
            </div>
            
            <div class="card-grid" id="cardGrid"></div>
        </div>
    </div>

    <!-- ФУТЕР (твой) -->
    <footer>
        <div class="container">
            <p class="stardust">✦ Каждое фото — это застывшая эмоция ✦</p>
            <p>© <span id="current-year"></span> Галина Чернякова</p>
        </div>
    </footer>

    <!-- Подключаем JS (твой, для кнопки наверх, аналитики и меню) -->
    <script src="js/main.js"></script>

    <!-- Скрипт для этой страницы -->
    <script>
        // Данные для открыток
        const cardsData = [
            { img: "images/gallery/macro/5.webp", title: "Золотой глаз", desc: "Капля как зеркало души." },
            { img: "images/gallery/macro/14.webp", title: "Утренний бархат", desc: "Тишина на кончиках листьев." },
            { img: "images/gallery/macro/1.webp", title: "Алые капли", desc: "Мир, который мы не замечаем." },
            { img: "images/gallery/macro/13.webp", title: "Капля на игле", desc: "Баланс на грани." },
            { img: "images/gallery/concept/14.webp", title: "Яйцо на вилке", desc: "Тонкий баланс." },
            { img: "images/gallery/nature/4.webp", title: "Сакура в сумерках", desc: "Цветы, которые цветут лишь для того, чтобы напомнить о быстротечности." },
            // Добавь сюда свои строки, если хочешь ещё
        ];

        const grid = document.getElementById('cardGrid');

        // Генерация открыток
        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flip-3d-card';
            card.innerHTML = `
                <div class="flip-3d-inner">
                    <div class="flip-3d-front">
                        <img src="${item.img}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="flip-3d-back">
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                </div>
            `;
            card.addEventListener('click', function() { this.classList.toggle('flipped'); });
            grid.appendChild(card);
        });

        // СКРИПТ БУРГЕРА (на случай, если в main.js он не сработает на новой странице)
        document.addEventListener("DOMContentLoaded", function() {
            var burgerBtn = document.getElementById("burgerBtn");
            var navMenu = document.querySelector(".nav");
            if (burgerBtn && navMenu) {
                burgerBtn.addEventListener("click", function(e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });
                document.addEventListener("click", function(e) {
                    if (navMenu.classList.contains("active")) {
                        if (!navMenu.contains(e.target) && !burgerBtn.contains(e.target)) {
                            navMenu.classList.remove("active");
                        }
                    }
                });
            }
        });
    </script>
</body>
