<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карточки настроения | Галина Чернякова</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- Цвета и база --- */
        :root {
            --bg: #181715;
            --text: #F7F3EE;
            --muted: #D2CBC2;
            --accent: #C39A74;
            --line: rgba(255, 255, 255, 0.08);
            --shadow: 0 30px 70px rgba(0,0,0,0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-top: 80px !important; /* Отступ под хедер */
            position: relative;
        }

        /* --- ФОН --- */
        #top-layer-gerbera {
            position: fixed;
            top: 0;
            right: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: 43% center;
            opacity: 0.65;
            filter: blur(0px);
            pointer-events: none;
            z-index: 0;
        }

        /* --- ЛОГОТИП --- */
        .site-logo {
            position: fixed;
            top: 5px;
            left: 30px;
            z-index: 101;
            height: 70px;
            width: auto;
            max-width: 240px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
            transition: opacity 0.2s;
            object-fit: contain;
        }
        @media (max-width: 900px) {
            .site-logo { height: 44px; top: 2px; left: 10px; max-width: 200px; }
        }

        /* --- ХЕДЕР И МЕНЮ (Твой стандартный) --- */
        header {
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            z-index: 100 !important;
            background: rgba(18, 18, 18, 0.58) !important;
            backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
            margin: 0 !important;
        }
        .header-inner {
            width: 100%;
            max-width: 1400px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 20px;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav li { position: relative; list-style: none; }
        .nav a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: 0.3s;
            padding: 6px 0;
        }
        .nav a:hover { color: #FFFFFF; }
        .nav a.active { color: var(--accent); }

        .burger-btn {
            display: none;
        }

        @media (max-width: 900px) {
            .nav.active { display: flex !important; }
            .nav {
                display: none;
                flex-direction: column;
                position: fixed;
                top: 70px;
                right: 20px;
                width: 55%;
                max-width: 260px;
                background: rgba(24, 23, 21, 0.96);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 20px;
                padding: 12px 0;
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
                z-index: 999;
            }
            .nav li { width: 100%; text-align: center; }
            .nav a { display: block; padding: 6px 0; font-size: 16px; color: var(--muted); }
            .nav a:hover { color: #FFFFFF; }
            .burger-btn {
                display: flex;
                flex-direction: column;
                gap: 4px;
                cursor: pointer;
                z-index: 1000;
                padding: 5px;
                position: absolute;
                right: 20px;
                top: 50%;
                transform: translateY(-50%);
                background: transparent;
                border: none;
            }
            .burger-btn span {
                display: block;
                width: 22px;
                height: 2px;
                background-color: var(--muted);
                border-radius: 1px;
                transition: 0.3s;
            }
            .nav.active ~ .burger-btn span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
            .nav.active ~ .burger-btn span:nth-child(2) { opacity: 0; }
            .nav.active ~ .burger-btn span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* --- ЗАГОЛОВОК --- */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 50px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header-section h1 {
            font-size: clamp(32px, 4vw, 56px);
            font-weight: 300;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .header-section h1 span { color: var(--accent); font-weight: 600; }
        .header-section .sub {
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* --- СЕТКА --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        /* --- 3D КАРТОЧКА --- */
        .flip-3d-card {
            perspective: 2500px; 
            perspective-origin: right center; 
            cursor: pointer;
            aspect-ratio: 3 / 2;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .flip-3d-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-style: preserve-3d;
            border-radius: 16px;
        }

        .flip-3d-card.flipped .flip-3d-inner {
            transform: rotateY(-180deg);
        }

        .flip-3d-front, .flip-3d-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
        }

        .flip-3d-front {
            background: #1a1816;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 1px solid var(--line);
        }
        .flip-3d-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .flip-3d-back {
            background: rgba(24, 23, 21, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        .flip-3d-back h3 {
            color: var(--accent);
            font-size: 26px;
            font-weight: 400;
            margin-bottom: 12px;
        }
        .flip-3d-back p {
            font-size: 16px;
            color: var(--muted);
            line-height: 1.6;
            font-weight: 300;
            max-width: 85%;
        }

        @media (max-width: 700px) {
            .card-grid { grid-template-columns: 1fr; gap: 30px; }
            .flip-3d-card { aspect-ratio: 4 / 3; }
            .flip-3d-back { padding: 30px; }
            .flip-3d-back h3 { font-size: 22px; }
            .flip-3d-back p { font-size: 15px; max-width: 90%; }
        }

        /* --- ТРЯСКА --- */
        .shake-rain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(195, 154, 116, 0), rgba(195, 154, 116, 0.5));
            border-radius: 20px;
            animation: fall 0.8s linear forwards;
            opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ФОН -->
    <img id="top-layer-gerbera" src="images/bg.webp">

    <!-- ЛОГО -->
    <a href="index.html">
        <img src="images/logo.png" alt="Галина Чернякова Photography" class="site-logo">
    </a>

    <!-- ХЕДЕР + МЕНЮ -->
    <header>
        <div class="header-inner">
            <button class="burger-btn" id="burgerBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav" id="mainNav">
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О себе</a></li>
                <li><a href="projects.html">Проекты</a></li>
                <li><a href="achievements.html">Достижения</a></li>
                
                <li class="dropdown">
                    <span class="dropdown-toggle">Галерея</span>
                    <ul class="dropdown-content">
                        <li><a href="macro.html">Макромир</a></li>
                        <li><a href="concept.html">Концепт</a></li>
                        <li><a href="nature.html">Природа</a></li>
                    </ul>
                </li>

                <li><a href="news.html">Новости</a></li>
                <li><a href="faq.html">Вопросы и ответы</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="cards.html" class="active">Карточки</a></li> <!-- ДОБАВЛЕНО -->
            </ul>
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <div class="container">
        <div class="header-section">
            <div>
                <h1>Карточки <span>настроения</span></h1>
                <div class="sub">Нажми, чтобы перевернуть и прочитать</div>
            </div>
        </div>
        
        <div class="card-grid" id="cardGrid"></div>
    </div>

    <script>
        // === 10 ОТКРЫТОК ===
        const cardsData = [
            { 
                img: "images/gallery/macro/5.webp", 
                title: "Золотой глаз", 
                desc: "Капля — это зеркало, в котором отражается бесконечность. Остановись и увидь." 
            },
            { 
                img: "images/gallery/macro/14.webp", 
                title: "Утренний бархат", 
                desc: "Тишина, которая оседает на лепестках. Момент, когда мир только просыпается." 
            },
            { 
                img: "images/gallery/macro/1.webp", 
                title: "Алые капли", 
                desc: "Иногда красота — это просто капля, упавшая в нужный момент в нужном свете." 
            },
            { 
                img: "images/gallery/macro/13.webp", 
                title: "Капля на игле", 
                desc: "Баланс на грани. Мир держится на таких моментах." 
            },
            { 
                img: "images/gallery/macro/3.webp", 
                title: "Орхидея с росой", 
                desc: "Природа не терпит суеты. Она создаёт шедевры в тишине." 
            },
            { 
                img: "images/gallery/nature/4.webp", 
                title: "Сакура в сумерках", 
                desc: "Цветы, которые цветут лишь для того, чтобы напомнить нам о быстротечности прекрасного." 
            },
            { 
                img: "images/gallery/nature/2.webp", 
                title: "Морозный рассвет", 
                desc: "Зима — это не холод. Это время, когда мир становится графичным и чистым." 
            },
            { 
                img: "images/gallery/nature/1.webp", 
                title: "Осеннее отражение", 
                desc: "Листья падают не потому, что умирают. Они просто меняют свой путь." 
            },
            { 
                img: "images/gallery/concept/14.webp", 
                title: "Яйцо на вилке", 
                desc: "Тонкий баланс. Концепт, который держится на одном движении." 
            },
            { 
                img: "images/gallery/concept/13.webp", 
                title: "Лимонный дождь", 
                desc: "Когда свет проходит сквозь воду, рождается настроение." 
            }
        ];

        const grid = document.getElementById('cardGrid');

        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flip-3d-card';
            card.innerHTML = `
                <div class="flip-3d-inner">
                    <div class="flip-3d-front">
                        <img src="${item.img}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="flip-3d-back">
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                </div>
            `;
            card.addEventListener('click', function() { this.classList.toggle('flipped'); });
            grid.appendChild(card);
        });

        // === МЕНЮ БУРГЕР ===
        document.addEventListener("DOMContentLoaded", function() {
            var burgerBtn = document.getElementById("burgerBtn");
            var navMenu = document.querySelector(".nav");
            if (burgerBtn && navMenu) {
                burgerBtn.addEventListener("click", function(e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });
                document.addEventListener("click", function(e) {
                    if (navMenu.classList.contains("active")) {
                        if (!navMenu.contains(e.target) && !burgerBtn.contains(e.target)) {
                            navMenu.classList.remove("active");
                        }
                    }
                });
            }
        });

        // === ТРЯСКА ===
        if (window.DeviceMotionEvent) {
            let lastShakeTime = 0;
            const SHAKE_THRESHOLD = 15;
            window.addEventListener('devicemotion', function(event) {
                const acc = event.accelerationIncludingGravity;
                const totalAcc = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
                const now = Date.now();
                if (totalAcc > SHAKE_THRESHOLD && (now - lastShakeTime > 1500)) {
                    lastShakeTime = now;
                    document.querySelectorAll('.flip-3d-card').forEach(el => {
                        if (Math.random() > 0.5) el.classList.add('flipped');
                        else el.classList.remove('flipped');
                    });
                    const rainContainer = document.createElement('div');
                    rainContainer.className = 'shake-rain';
                    document.body.appendChild(rainContainer);
                    for (let i = 0; i < 25; i++) {
                        const drop = document.createElement('div');
                        drop.className = 'drop';
                        drop.style.left = Math.random() * 100 + '%';
                        drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                        drop.style.animationDelay = Math.random() * 0.8 + 's';
                        rainContainer.appendChild(drop);
                    }
                    setTimeout(() => rainContainer.remove(), 2000);
                }
            });
        }
    </script>
</body>
</html>
