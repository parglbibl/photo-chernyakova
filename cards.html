<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Открытки | Галина Чернякова</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #11100e;
            --text: #F7F3EE;
            --accent: #C39A74;
            --shadow: 0 30px 70px rgba(0,0,0,0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(195, 154, 116, 0.05) 0%, transparent 50%);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 60px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header-section h1 {
            font-size: clamp(32px, 4vw, 56px);
            font-weight: 300;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .header-section h1 span { color: var(--accent); font-weight: 600; }
        .header-section .sub {
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 300;
            text-transform: uppercase;
        }
        .back-link {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            transition: 0.3s;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .back-link:hover { color: var(--accent); }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        /* === САМАЯ ПЛАВНАЯ 3D КАРТОЧКА === */
        .flip-3d-card {
            perspective: 2500px; /* Максимальная глубина */
            perspective-origin: right center; /* Точка обзора справа */
            cursor: pointer;
            aspect-ratio: 3 / 2;
            border-radius: 16px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .flip-3d-inner {
            position: relative;
            width: 100%;
            height: 100%;
            /* МАГИЯ ПЛАВНОСТИ: cubic-bezier с перелётом и пружиной */
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
        }

        .flip-3d-card.flipped .flip-3d-inner {
            transform: rotateY(-180deg);
        }

        .flip-3d-front, .flip-3d-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
        }

        .flip-3d-front {
            background: #1a1816;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .flip-3d-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
        }
        .flip-3d-card:not(.flipped):hover .flip-3d-front img {
            transform: scale(1.02);
        }

        .flip-3d-back {
            background: linear-gradient(160deg, #1f1c19, #0a0908);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .flip-3d-back h3 {
            color: var(--accent);
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 15px;
        }
        .flip-3d-back p {
            font-size: 17px;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
            font-weight: 300;
            max-width: 80%;
        }
        .flip-3d-back .icon-deco {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: 0.4;
            color: var(--accent);
        }

        @media (max-width: 700px) {
            .header-section { flex-direction: column; align-items: flex-start; }
            .card-grid { grid-template-columns: 1fr; gap: 30px; }
            .flip-3d-card { aspect-ratio: 4 / 3; }
            .flip-3d-back { padding: 30px; }
            .flip-3d-back h3 { font-size: 22px; }
            .flip-3d-back p { font-size: 15px; max-width: 90%; }
        }

        .shake-rain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(195, 154, 116, 0), rgba(195, 154, 116, 0.5));
            border-radius: 20px;
            animation: fall 0.8s linear forwards;
            opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div>
                <h1>Открытки <span>Галины</span></h1>
                <div class="sub">Нажми, чтобы раскрыть</div>
            </div>
            <a href="index.html" class="back-link">Вернуться →</a>
        </div>
        
        <div class="card-grid" id="cardGrid"></div>
    </div>

    <script>
        const cardsData = [
            { img: "images/gallery/macro/5.webp", title: "Золотой глаз", desc: "Капля как зеркало души." },
            { img: "images/gallery/macro/14.webp", title: "Утренний бархат", desc: "Тишина на кончиках листьев." },
            { img: "images/gallery/macro/1.webp", title: "Алые капли", desc: "Мир, который мы не замечаем." },
            { img: "images/gallery/macro/13.webp", title: "Капля на игле", desc: "Баланс на грани." },
        ];

        const grid = document.getElementById('cardGrid');

        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flip-3d-card';
            card.innerHTML = `
                <div class="flip-3d-inner">
                    <div class="flip-3d-front">
                        <img src="${item.img}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="flip-3d-back">
                        <div class="icon-deco">✦</div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                </div>
            `;
            card.addEventListener('click', function() { this.classList.toggle('flipped'); });
            grid.appendChild(card);
        });

        // Тряска
        if (window.DeviceMotionEvent) {
            let lastShakeTime = 0;
            const SHAKE_THRESHOLD = 15;

            window.addEventListener('devicemotion', function(event) {
                const acc = event.accelerationIncludingGravity;
                const totalAcc = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
                const now = Date.now();

                if (totalAcc > SHAKE_THRESHOLD && (now - lastShakeTime > 1500)) {
                    lastShakeTime = now;

                    document.querySelectorAll('.flip-3d-card').forEach(el => {
                        if (Math.random() > 0.5) el.classList.add('flipped');
                        else el.classList.remove('flipped');
                    });

                    const rainContainer = document.createElement('div');
                    rainContainer.className = 'shake-rain';
                    document.body.appendChild(rainContainer);

                    for (let i = 0; i < 25; i++) {
                        const drop = document.createElement('div');
                        drop.className = 'drop';
                        drop.style.left = Math.random() * 100 + '%';
                        drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                        drop.style.animationDelay = Math.random() * 0.8 + 's';
                        rainContainer.appendChild(drop);
                    }

                    setTimeout(() => rainContainer.remove(), 2000);
                }
            });
        }
    </script>
</body>
</html>
