<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Открытки | Галина Чернякова</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #11100e;
            --text: #F7F3EE;
            --accent: #C39A74;
            --paper-bg: #1a1816;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(195, 154, 116, 0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Заголовок --- */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 60px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header-section h1 {
            font-size: clamp(32px, 4vw, 56px);
            font-weight: 300;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .header-section h1 span {
            color: var(--accent);
            font-weight: 600;
        }
        .header-section .sub {
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 300;
            text-transform: uppercase;
        }
        .back-link {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            transition: 0.3s;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .back-link:hover { color: var(--accent); }

        /* --- Сетка карточек --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px 30px;
        }

        /* --- Карточка-открытка --- */
        .postcard {
            perspective: 1500px;
            cursor: pointer;
            aspect-ratio: 4 / 5;
            background: transparent;
            border-radius: 4px; /* Уголки как у бумаги */
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .postcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-style: preserve-3d;
        }

        /* Когда открытка раскрыта */
        .postcard.opened .postcard-inner {
            transform: rotateY(-180deg);
        }

        /* Левая и правая "страницы" открытки */
        .postcard-front, .postcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 4px;
            overflow: hidden;
            background: #151311;
        }

        /* Левая страница (сгиб) - ФОТО */
        .postcard-front {
            transform-origin: left center;
            transform: rotateY(0deg); /* Лежит перед нами */
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.3); /* Тень от сгиба */
        }
        .postcard-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Правая страница (сгиб) - ТЕКСТ */
        .postcard-back {
            transform-origin: left center;
            transform: rotateY(180deg); /* Скрыта за фото */
            background: var(--paper-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.5); /* Тень от сгиба внутри */
        }

        /* Текст на внутренней стороне */
        .postcard-back h3 {
            color: var(--accent);
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }
        .postcard-back p {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
            font-weight: 300;
            max-width: 80%;
        }
        .postcard-back .icon-deco {
            font-size: 32px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* --- Эффект капель (Тряска) --- */
        .shake-rain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 2px;
            height: 30px;
            background: linear-gradient(to bottom, rgba(195, 154, 116, 0), rgba(195, 154, 116, 0.6));
            border-radius: 20px;
            animation: fall 0.9s linear forwards;
            opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }

        @media (max-width: 700px) {
            .header-section {
                flex-direction: column;
                align-items: flex-start;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 20px 15px;
            }
            .postcard-back h3 { font-size: 18px; }
            .postcard-back p { font-size: 13px; max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div>
                <h1>Открытки <span>от Галины</span></h1>
                <div class="sub">Коснись или кликни, чтобы раскрыть</div>
            </div>
            <a href="index.html" class="back-link">Вернуться на главную →</a>
        </div>
        
        <div class="card-grid" id="cardGrid">
            <!-- JS сюда вставит открытки -->
        </div>
    </div>

    <script>
        const cardsData = [
            { img: "images/gallery/macro/1.webp", title: "Алые капли", desc: "Мир, который мы не замечаем." },
            { img: "images/gallery/macro/5.webp", title: "Золотой глаз", desc: "Капля как зеркало души." },
            { img: "images/gallery/macro/14.webp", title: "Утренний бархат", desc: "Тишина на кончиках листьев." },
            { img: "images/gallery/macro/13.webp", title: "Капля на игле", desc: "Баланс на грани." },
            { img: "images/gallery/macro/3.webp", title: "Орхидея с росой", desc: "Красота в деталях." },
            // Добавь новые строки для каждой новой открытки
        ];

        const grid = document.getElementById('cardGrid');

        // Генерация открыток
        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'postcard';

            card.innerHTML = `
                <div class="postcard-inner">
                    <div class="postcard-front">
                        <img src="${item.img}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="postcard-back">
                        <div class="icon-deco">✦</div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                </div>
            `;

            // Клик/тап для раскрытия
            card.addEventListener('click', function() {
                this.classList.toggle('opened');
            });

            grid.appendChild(card);
        });

        // Тряска для телефона (Шейкер)
        if (window.DeviceMotionEvent) {
            let lastShakeTime = 0;
            const SHAKE_THRESHOLD = 15;

            window.addEventListener('devicemotion', function(event) {
                const acc = event.accelerationIncludingGravity;
                const totalAcc = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
                const now = Date.now();

                if (totalAcc > SHAKE_THRESHOLD && (now - lastShakeTime > 1500)) {
                    lastShakeTime = now;

                    document.querySelectorAll('.postcard').forEach(el => {
                        if (Math.random() > 0.5) el.classList.add('opened');
                        else el.classList.remove('opened');
                    });

                    const rainContainer = document.createElement('div');
                    rainContainer.className = 'shake-rain';
                    document.body.appendChild(rainContainer);

                    for (let i = 0; i < 25; i++) {
                        const drop = document.createElement('div');
                        drop.className = 'drop';
                        drop.style.left = Math.random() * 100 + '%';
                        drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                        drop.style.animationDelay = Math.random() * 0.8 + 's';
                        rainContainer.appendChild(drop);
                    }

                    setTimeout(() => rainContainer.remove(), 2000);
                }
            });
        }
    </script>
</body>
</html>
